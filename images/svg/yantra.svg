<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Outer circle -->
  <circle cx="80" cy="80" r="72" stroke="#C9963A" stroke-width="0.6" opacity="0.15"/>
  
  <!-- Inner geometric yantra — concentric rings -->
  <circle cx="80" cy="80" r="55" stroke="#C9963A" stroke-width="0.5" opacity="0.12"/>
  
  <!-- Triangles pointing up (Shiva) -->
  <path d="M80 30 L115 95 L45 95 Z" stroke="#C9963A" stroke-width="0.7" opacity="0.12" fill="none"/>
  
  <!-- Triangles pointing down (Shakti) -->
  <path d="M80 130 L45 65 L115 65 Z" stroke="#C9963A" stroke-width="0.7" opacity="0.12" fill="none"/>
  
  <!-- Central bindu -->
  <circle cx="80" cy="80" r="4" stroke="#E07B2A" stroke-width="0.6" opacity="0.15" fill="none"/>
  <circle cx="80" cy="80" r="1.5" fill="#E07B2A" opacity="0.1"/>
  
  <!-- Petal arcs around center -->
  <path d="M80 56 Q90 68 80 80 Q70 68 80 56Z" stroke="#C9963A" stroke-width="0.5" opacity="0.1" fill="none"/>
  <path d="M104 80 Q92 90 80 80 Q92 70 104 80Z" stroke="#C9963A" stroke-width="0.5" opacity="0.1" fill="none"/>
  <path d="M80 104 Q70 92 80 80 Q90 92 80 104Z" stroke="#C9963A" stroke-width="0.5" opacity="0.1" fill="none"/>
  <path d="M56 80 Q68 70 80 80 Q68 90 56 80Z" stroke="#C9963A" stroke-width="0.5" opacity="0.1" fill="none"/>
</svg>
